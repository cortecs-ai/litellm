name: pre-commit checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GIT_LLM_ROUTER_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH=${{ github.event.pull_request.base.ref }}
          else
            # For push events, compare against the default branch (usually dev or main)
            TARGET_BRANCH=dev
          fi
          echo "Running pre-commit against $TARGET_BRANCH"
          pre-commit run --from-ref origin/$TARGET_BRANCH --to-ref HEAD
